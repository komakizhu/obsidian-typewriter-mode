<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高亮材质 · 外观对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111214;color:#ebebed;font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;--pane:#202022;--text:#d2d2d5;--muted:#89898f;--line:#343438;--fill:rgba(220,220,230,.13);--glass:rgba(220,220,230,.085);--edge:rgba(255,255,255,.29);--radius:13px}
body.light{background:#f1f1f3;color:#26262b;--pane:#fafafa;--text:#42424a;--muted:#929299;--line:#dfdfe4;--fill:rgba(70,70,90,.1);--glass:rgba(220,224,232,.27);--edge:rgba(255,255,255,.95)}
main{max-width:1500px;margin:auto;padding:44px 36px}header .eyebrow{color:#ad9ae6;font-size:11px;letter-spacing:3px}h1{font-size:32px;letter-spacing:-1px;line-height:1.25;margin:12px 0}header p{color:var(--muted);margin:12px 0 27px}.toolbar{display:flex;gap:26px;flex-wrap:wrap;padding:20px 0 26px;border-bottom:1px solid var(--line)}.control>span{display:block;font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:1px}.seg{display:flex;background:var(--pane);padding:4px;border:1px solid var(--line);border-radius:10px;gap:3px}button{font:inherit;font-size:13px;cursor:pointer;border:0;border-radius:6px;background:transparent;color:var(--muted);padding:6px 14px}button.active{background:#8170ae;color:white;box-shadow:0 2px 7px #0002}button:focus-visible{outline:2px solid #b7a0ff;outline-offset:3px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:28px}.card{min-width:0}.caption{display:flex;align-items:center;justify-content:space-between;margin:0 0 13px}.caption h2{margin:0;font-size:18px;font-weight:550}.tag{font-size:10px;color:var(--muted);letter-spacing:1px}.pane{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--pane);box-shadow:0 15px 40px #0001}.tabs{font-size:11px;color:var(--muted);padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.paper{position:relative;padding:28px 0 30px;min-height:430px}.text{margin:0 42px;position:relative;z-index:2;pointer-events:none;color:var(--text);font-size:13px;line-height:1.95}.text .crumb{font-size:10px;color:var(--muted);letter-spacing:.5px}.text h3{font-size:22px;margin:12px 0 8px;font-weight:600}.text .intro{color:var(--muted);margin:0 0 23px}.target{position:relative;margin:0 8px;min-height:158px;padding:13px 0}.target .text{margin:0 34px}.target h4{font-size:14px;margin:0 0 10px}.target p{margin:0 0 8px}.target .single{display:none}.target .cursor{display:inline-block;width:1.5px;height:15px;background:#b6a0ec;vertical-align:-2px;margin-left:3px}.surface{position:absolute;inset:0;pointer-events:none;z-index:1;border-radius:var(--radius);background:var(--fill)}.right{display:none}.sides .surface{right:auto;width:28px}.sides .right{display:block;left:auto;right:0}.frost .surface{background:var(--glass);backdrop-filter:blur(16px) saturate(.8);border:1px solid color-mix(in srgb,var(--edge) 50%,transparent);box-shadow:inset 0 1px 0 #ffffff0c,0 3px 10px #00000009}.liquid .surface{background:linear-gradient(130deg,#ffffff17,transparent 38%,#ffffff04 65%,#ffffff13);backdrop-filter:blur(4px) saturate(1.25);border:1px solid var(--edge);box-shadow:inset 0 1px 1px #ffffff61,inset 0 -1px 1px #ffffff30,inset 2px 0 5px #ffffff0c,0 5px 14px #00000014}.liquid .surface:after{content:"";position:absolute;inset:1px;border-radius:inherit;background:linear-gradient(115deg,#ffffff18,transparent 27%,transparent 72%,#ffffff0a);pointer-events:none}.after{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.description{font-size:13px;color:var(--muted);margin:16px 2px 0}.description strong{font-weight:500;color:var(--text)}.note{margin-top:28px;padding:17px 20px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.line .target{min-height:0;height:43px;padding:8px 0}.line .target .block{display:none}.line .target .single{display:block;white-space:nowrap}.line{--radius:9px}.square{--radius:0px}.question{font-size:16px;margin-top:28px}.footer{color:var(--muted);font-size:12px}.light .liquid .surface{background:linear-gradient(130deg,#ffffffa0,#ffffff18 40%,#ffffff50);box-shadow:inset 0 1px 2px white,inset 0 -1px 2px #ffffffc0,0 4px 12px #292e4012;border-color:#ffffffd0;outline:1px solid #383e4e0c}@media(max-width:1000px){.cards{grid-template-columns:1fr}.paper{min-height:0}.text{margin:0 64px}.target .text{margin:0 56px}.sides .surface{width:48px}main{padding:28px 20px}.toolbar{gap:16px}}
</style></head>
<body class="sides"><main>
<header><div class="eyebrow">TYPEWRITER / MATERIAL STUDY 01</div><h1>让高亮，多一点质感。</h1><p>同一段笔记，三种材质。范围与形状独立切换，文字始终清晰。</p></header>
<div class="toolbar">
<div class="control"><span>高亮范围</span><div class="seg" data-group="range"><button class="active" data-value="sides" aria-pressed="true">仅左右两侧</button><button data-value="full" aria-pressed="false">整条高亮</button></div></div>
<div class="control"><span>形状</span><div class="seg" data-group="shape"><button class="active" data-value="round" aria-pressed="true">圆角</button><button data-value="square" aria-pressed="false">方角</button></div></div>
<div class="control"><span>内容高度</span><div class="seg" data-group="height"><button class="active" data-value="block" aria-pressed="true">段落</button><button data-value="line" aria-pressed="false">单行</button></div></div>
<div class="control"><span>主题</span><div class="seg" data-group="theme"><button class="active" data-value="dark" aria-pressed="true">深色</button><button data-value="light" aria-pressed="false">浅色</button></div></div>
</div>
<div class="cards" id="cards"></div>
<div class="note">外观设计稿：左右留白使用接近 Obsidian 的纯色背景，没有添加彩色壁纸强化玻璃效果。液态玻璃展示通透底色与边缘反光方向，真实折射效果及滚动表现仍需在插件中验证。这页不会修改 Obsidian 设置。</div>
<p class="question">重点看看：玻璃边缘的亮度，以及圆角与文字的距离，是否舒服？</p><p class="footer">直接在聊天里告诉我想调整的地方。三种材质都会保留，不需要只选其中一种。</p>
</main><script>
const materials=[['plain','普通','01 / SOLID','保留熟悉的高亮','平整底色，定位直接；作为对比基准。'],['frost','磨砂毛玻璃','02 / FROSTED','柔和、安静','轻雾底色与细边框，玻璃感比较克制。'],['liquid','液态玻璃','03 / LIQUID','通透、有层次','边缘更亮，带柔和阴影；比磨砂更有存在感。']];
document.getElementById('cards').innerHTML=materials.map(([cls,name,index,title,desc])=>`<section class="card ${cls}"><div class="caption"><h2>${name}</h2><span class="tag">${index}</span></div><div class="pane"><div class="tabs"><span>▧　阅读理解 · 复盘</span><span>···</span></div><div class="paper"><div class="text"><span class="crumb">我的笔记 / 每日复盘</span><h3>把注意力放回当下</h3><p class="intro">阅读、理解，然后用自己的话记下来。</p></div><div class="target"><div class="surface"></div><div class="surface right"></div><div class="text"><div class="block"><h4>我的笔记</h4><p>中心句定位不足：没有优先利用“因此”确定作者的核心观点。</p><p>先找到段落的主旨，再判断每个选项的范围。<span class="cursor"></span></p></div><div class="single">先找到段落的主旨。<span class="cursor"></span></div></div></div><div class="text"><div class="after">下一步<br>整理思路，把关键判断写清楚。</div></div></div></div><p class="description"><strong>${title}</strong><br>${desc}</p></section>`).join('');
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;seg.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',b===button?'true':'false')});const values={range:['sides','full'],shape:['round','square'],height:['block','line'],theme:['dark','light']}[seg.dataset.group];values.forEach(v=>document.body.classList.remove(v));document.body.classList.add(button.dataset.value)}));
</script></body></html>
